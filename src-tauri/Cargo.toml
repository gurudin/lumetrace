[package]
name = "lumetrace"
version = "1.0.4"
description = "A traceable local-first file workspace"
authors = ["Lume Trace Contributors"]
edition = "2021"

[lib]
name = "lumetrace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
drag = "2.1.1"
fastembed = { version = "6.0.2", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
notify = "8"
pdf-extract = { path = "vendor/pdf-extract" }
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
usearch = { version = "2.26.2", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }
