<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">A separate workspace for every project</title>
  <desc id="description">Feature illustration with example workspaces Writing, Research, and Personal. Writing is active. Each workspace has its own files and history.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e7eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#304d77" flood-opacity=".10"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="50" y="32" width="620" height="332" rx="20" fill="#fff" filter="url(#shadow)"/>
    <text x="80" y="79" font-size="26" font-weight="500" fill="#22364f">File workspaces</text>
    <rect x="74" y="102" width="572" height="72" rx="12" fill="#edf4ff"/>
    <rect x="92" y="120" width="38" height="36" rx="8" fill="#3d73b8"/>
    <text x="111" y="145" text-anchor="middle" font-size="23" font-weight="500" fill="#fff">W</text>
    <text x="149" y="147" font-size="27" font-weight="500" fill="#284f84">Writing</text>
    <text x="620" y="145" text-anchor="end" font-size="23" fill="#315e9d">Active</text>
    <rect x="92" y="196" width="38" height="36" rx="8" fill="#edf1f6"/>
    <text x="111" y="221" text-anchor="middle" font-size="23" font-weight="500" fill="#60728a">R</text>
    <text x="149" y="223" font-size="27" fill="#304863">Research</text>
    <path d="M88 251 H630" stroke="#edf0f5"/>
    <rect x="92" y="270" width="38" height="36" rx="8" fill="#edf1f6"/>
    <text x="111" y="295" text-anchor="middle" font-size="23" font-weight="500" fill="#60728a">P</text>
    <text x="149" y="297" font-size="27" fill="#304863">Personal</text>
  </g>
</svg>
