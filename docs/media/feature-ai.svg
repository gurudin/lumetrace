<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Ask Lumie about your files and their changes</title>
  <desc id="description">Feature illustration with synthetic content: ask what changed from V1 to V2. The answer identifies a Draft to Ready status change and cites Launch Plan.md for that version range.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e7eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#304d77" flood-opacity=".10"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="50" y="32" width="620" height="332" rx="20" fill="#fff" filter="url(#shadow)"/>
    <text x="80" y="79" font-size="26" font-weight="500" fill="#22364f">Lumie</text>
    <rect x="129" y="101" width="515" height="57" rx="14" fill="#edf4ff"/>
    <text x="152" y="137" font-size="25" fill="#284f84">What changed from V1 to V2?</text>
    <text x="80" y="207" font-size="26" fill="#304863">The status changed from</text>
    <text x="80" y="245" font-size="26" fill="#304863">Draft to Ready. <tspan fill="#315e9d">[S1]</tspan></text>
    <path d="M80 272 H640" stroke="#e8edf4"/>
    <rect x="80" y="291" width="52" height="38" rx="8" fill="#edf4ff"/>
    <text x="106" y="317" text-anchor="middle" font-size="23" font-weight="500" fill="#315e9d">S1</text>
    <text x="149" y="317" font-size="24" fill="#315e9d">Launch Plan.md · V1 → V2</text>
  </g>
</svg>
