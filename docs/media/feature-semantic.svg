<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">An optional semantic index, built locally</title>
  <desc id="description">Feature illustration showing the Multilingual E5 Small model and a local pipeline from file text through embeddings to an index. Download the model from Hugging Face; workspace text and vectors stay local during indexing.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e7eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#304d77" flood-opacity=".10"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="50" y="32" width="620" height="332" rx="20" fill="#fff" filter="url(#shadow)"/>
    <rect x="80" y="65" width="76" height="76" rx="16" fill="#e8f0fd"/>
    <text x="118" y="114" text-anchor="middle" font-size="34" font-weight="500" fill="#315e9d">E5</text>
    <text x="177" y="96" font-size="27" font-weight="500" fill="#22364f">Multilingual E5 Small</text>
    <text x="177" y="132" font-size="23" fill="#60728a">From Hugging Face</text>
    <path d="M80 168 H640" stroke="#e8edf4"/>
    <rect x="80" y="207" width="136" height="59" rx="10" fill="#f2f5fa"/>
    <rect x="265" y="207" width="193" height="59" rx="10" fill="#edf4ff"/>
    <rect x="507" y="207" width="133" height="59" rx="10" fill="#f2f5fa"/>
    <path d="M228 236 H251 M244 229 L251 236 L244 243 M470 236 H493 M486 229 L493 236 L486 243" fill="none" stroke="#8da5c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g text-anchor="middle" font-size="24" font-weight="500">
      <text x="148" y="245" fill="#304863">File text</text>
      <text x="361" y="245" fill="#315e9d">Embeddings</text>
      <text x="573" y="245" fill="#304863">Index</text>
    </g>
    <text x="360" y="324" text-anchor="middle" font-size="24" fill="#60728a">Built and stored on your Mac.</text>
  </g>
</svg>
