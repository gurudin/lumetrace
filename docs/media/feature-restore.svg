<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Make an earlier version current</title>
  <desc id="description">Feature illustration: select V2 on a three-version timeline and make it current. V1 and V3 remain in the file history.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e7eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#304d77" flood-opacity=".10"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="50" y="32" width="620" height="332" rx="20" fill="#fff" filter="url(#shadow)"/>
    <text x="80" y="79" font-size="26" font-weight="500" fill="#22364f">Launch Plan.md</text>
    <path d="M155 170 H565" fill="none" stroke="#d3deec" stroke-width="3"/>
    <path d="M565 149 V132 Q565 118 551 118 H374 Q360 118 360 132 V142 M353 135 L360 142 L367 135" fill="none" stroke="#3d73b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="155" cy="170" r="8" fill="#fff" stroke="#a8bbd3" stroke-width="3"/>
    <circle cx="360" cy="170" r="21" fill="#e8f0fd"/>
    <circle cx="360" cy="170" r="10" fill="#3d73b8"/>
    <circle cx="565" cy="170" r="8" fill="#fff" stroke="#a8bbd3" stroke-width="3"/>
    <g text-anchor="middle" font-size="26" font-weight="500">
      <text x="155" y="215" fill="#60728a">V1</text>
      <text x="360" y="215" fill="#315e9d">V2</text>
      <text x="565" y="215" fill="#60728a">V3</text>
    </g>
    <rect x="239" y="243" width="242" height="49" rx="24" fill="#edf4ff"/>
    <text x="360" y="275" text-anchor="middle" font-size="25" font-weight="500" fill="#315e9d">V2 is current</text>
    <text x="360" y="332" text-anchor="middle" font-size="24" fill="#60728a">V1 and V3 stay in history.</text>
  </g>
</svg>
