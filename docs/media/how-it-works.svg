<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title description">
  <title id="title">No more final_final_v2_really_final.md. One file, every version.</title>
  <desc id="description">Workflow illustration for Launch Plan.md. Editing the same file creates versions V1, V2, V3, and V4 along a timeline. V1 and V4 are selected to compare non-adjacent versions. The example Diff changes Status: Draft to Status: Ready and replaces the original goal with Give every file a timeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4f7fc"/>
      <stop offset=".55" stop-color="#edf2fb"/>
      <stop offset="1" stop-color="#e9f0f8"/>
    </linearGradient>
    <radialGradient id="warm">
      <stop stop-color="#f9e3d2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f9e3d2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#304d77" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1440" height="800" fill="url(#background)"/>
  <ellipse cx="20" cy="720" rx="620" ry="380" fill="url(#warm)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="47" font-size="15" font-weight="500" letter-spacing="2.6" fill="#647792">ONE FILE. EVERY VERSION.</text>
    <text x="64" y="107" font-size="46" font-weight="600" letter-spacing="-1.2" fill="#172a48">No more <tspan font-family="Menlo, Consolas, monospace" font-size="42" font-weight="500" letter-spacing="-1" fill="#315e9d">final_final_v2_really_final.md</tspan>.</text>
    <text x="66" y="148" font-size="22" fill="#566d8a">Keep editing the same file. Its history stays with it.</text>

    <rect x="56" y="181" width="1328" height="571" rx="22" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="99" cy="217" r="6" fill="#3d73b8"/>
    <text x="118" y="224" font-size="23" font-weight="500" fill="#22364f">Launch Plan.md</text>
    <text x="1343" y="223" text-anchor="end" font-size="18" fill="#6b7d94">A growing history, not a growing pile of files.</text>
    <path d="M88 245 H1352" fill="none" stroke="#e8edf4"/>

    <path d="M185 312 H1255" fill="none" stroke="#d3deec" stroke-width="3"/>
    <g text-anchor="middle">
      <text x="185" y="284" font-size="27" font-weight="600" fill="#315e9d">V1</text>
      <text x="542" y="284" font-size="27" font-weight="500" fill="#546b86">V2</text>
      <text x="899" y="284" font-size="27" font-weight="500" fill="#546b86">V3</text>
      <text x="1255" y="284" font-size="27" font-weight="600" fill="#315e9d">V4</text>
      <circle cx="185" cy="312" r="17" fill="#e8f0fd"/>
      <circle cx="185" cy="312" r="9" fill="#3d73b8"/>
      <circle cx="542" cy="312" r="7" fill="#ffffff" stroke="#a8bbd3" stroke-width="3"/>
      <circle cx="899" cy="312" r="7" fill="#ffffff" stroke="#a8bbd3" stroke-width="3"/>
      <circle cx="1255" cy="312" r="17" fill="#e8f0fd"/>
      <circle cx="1255" cy="312" r="9" fill="#3d73b8"/>
      <text x="185" y="352" font-size="21" font-weight="500" fill="#304863">First draft</text>
      <text x="542" y="352" font-size="21" font-weight="500" fill="#304863">Clearer goal</text>
      <text x="899" y="352" font-size="21" font-weight="500" fill="#304863">Updated checklist</text>
      <text x="1255" y="352" font-size="21" font-weight="500" fill="#304863">Ready to share</text>
      <text x="185" y="380" font-size="16" fill="#75869b">INITIAL VERSION</text>
      <text x="1255" y="380" font-size="16" fill="#75869b">CURRENT VERSION</text>
    </g>

    <path d="M185 398 V406 Q185 418 197 418 H1243 Q1255 418 1255 406 V398" fill="none" stroke="#83a8d9" stroke-width="2"/>
    <rect x="547" y="398" width="346" height="40" rx="20" fill="#edf4ff"/>
    <text x="720" y="424" text-anchor="middle" font-size="19" font-weight="500" fill="#315e9d">Compare any two versions</text>

    <rect x="96" y="457" width="600" height="263" rx="13" fill="#fbfcfe" stroke="#e5eaf2"/>
    <rect x="744" y="457" width="600" height="263" rx="13" fill="#fbfcfe" stroke="#e5eaf2"/>
    <text x="118" y="493" font-size="20" font-weight="500" fill="#506682">V1 · BEFORE</text>
    <text x="766" y="493" font-size="20" font-weight="500" fill="#506682">V4 · AFTER</text>
    <path d="M712 590 H728 M722 584 L729 590 L722 596" fill="none" stroke="#839bb9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="111" y="512" width="570" height="60" rx="6" fill="#f8e0e2"/>
    <rect x="759" y="512" width="570" height="60" rx="6" fill="#e0f1e5"/>
    <rect x="267" y="524" width="79" height="36" rx="4" fill="#edb5ba"/>
    <rect x="915" y="524" width="79" height="36" rx="4" fill="#add9ba"/>
    <rect x="111" y="590" width="570" height="111" rx="6" fill="#f8e0e2"/>
    <rect x="759" y="590" width="570" height="111" rx="6" fill="#e0f1e5"/>
    <rect x="267" y="611" width="227" height="36" rx="4" fill="#edb5ba"/>
    <rect x="1026" y="611" width="159" height="36" rx="4" fill="#add9ba"/>
    <g font-family="Menlo, Consolas, monospace" font-size="23">
      <text x="128" y="550" fill="#a63e4b">−</text>
      <text x="159" y="550" fill="#713b46">Status: Draft</text>
      <text x="776" y="550" fill="#2d784b">+</text>
      <text x="807" y="550" fill="#285d3c">Status: Ready</text>
      <text x="128" y="637" fill="#a63e4b">−</text>
      <text x="159" y="637" fill="#713b46">Build a simple workspace</text>
      <text x="159" y="678" fill="#713b46">for local files.</text>
      <text x="776" y="637" fill="#2d784b">+</text>
      <text x="807" y="637" fill="#285d3c">Give every file a timeline.</text>
    </g>
    <text x="1376" y="778" text-anchor="end" font-size="13" letter-spacing="1.4" fill="#718299">WORKFLOW ILLUSTRATION · EXAMPLE CONTENT</text>
  </g>
</svg>
