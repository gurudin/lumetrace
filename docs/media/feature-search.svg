<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Find files by name, content, or tag</title>
  <desc id="description">Feature illustration of a launch query with example results Launch Plan.md and Project Notes.md. Search scopes include file names, indexed content, and tags. Results show names and paths, not body excerpts.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e7eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#304d77" flood-opacity=".10"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="50" y="32" width="620" height="332" rx="20" fill="#fff" filter="url(#shadow)"/>
    <rect x="76" y="57" width="568" height="60" rx="10" fill="#f7f9fc" stroke="#dce5f1"/>
    <text x="97" y="96" font-size="28" fill="#22364f">launch</text>
    <text x="618" y="95" text-anchor="end" font-size="24" fill="#60728a">⌘ K</text>
    <text x="80" y="154" font-size="23" fill="#60728a">File names · Content · Tags</text>
    <rect x="74" y="175" width="572" height="78" rx="10" fill="#edf4ff"/>
    <text x="96" y="207" font-size="26" font-weight="500" fill="#284f84">Launch Plan.md</text>
    <text x="96" y="237" font-size="22" fill="#566d8a">Writing / Launch</text>
    <text x="96" y="292" font-size="26" font-weight="500" fill="#304863">Project Notes.md</text>
    <text x="96" y="323" font-size="22" fill="#60728a">Research / Notes</text>
  </g>
</svg>
