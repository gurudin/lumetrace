<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Eight interface languages, light and dark appearance</title>
  <desc id="description">Feature illustration of language and appearance choices, not document translation. LumeTrace supports English, Simplified and Traditional Chinese, Japanese, Korean, German, French, and Spanish.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e7eef9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="14" flood-color="#304d77" flood-opacity=".10"/></filter>
  </defs>
  <rect width="720" height="400" rx="18" fill="url(#bg)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, PingFang SC, Hiragino Sans, Apple SD Gothic Neo, sans-serif">
    <rect x="50" y="32" width="620" height="332" rx="20" fill="#fff" filter="url(#shadow)"/>
    <text x="80" y="79" font-size="26" font-weight="500" fill="#22364f">Your language. Your look.</text>
    <rect x="80" y="105" width="274" height="71" rx="12" fill="#edf4ff"/>
    <text x="101" y="150" font-size="28" font-weight="500" fill="#315e9d">English</text>
    <text x="390" y="149" font-size="28" fill="#304863">简体中文</text>
    <text x="101" y="218" font-size="28" fill="#304863">日本語</text>
    <text x="390" y="218" font-size="28" fill="#304863">Deutsch</text>
    <path d="M80 248 H640" stroke="#e8edf4"/>
    <rect x="80" y="272" width="178" height="62" rx="11" fill="#f3f6fb" stroke="#e1e7f0"/>
    <text x="169" y="312" text-anchor="middle" font-size="24" fill="#304863">Light</text>
    <rect x="273" y="272" width="178" height="62" rx="11" fill="#29384d"/>
    <text x="362" y="312" text-anchor="middle" font-size="24" fill="#f0f4fa">Dark</text>
    <rect x="466" y="272" width="174" height="62" rx="11" fill="#f3f6fb" stroke="#e1e7f0"/>
    <text x="553" y="312" text-anchor="middle" font-size="24" fill="#304863">System</text>
  </g>
</svg>
